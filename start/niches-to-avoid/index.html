<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Niches to avoid - Accountancy Accelerator</title>
<meta name="description" content="Start, Level 4 Niche: Niches to avoid.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..800&display=swap" rel="stylesheet">
<style>
:root{--paper:#FFFFFF;--card:#F5F5F7;--ink:#111111;--muted:#555555;--slate:#6E6E73;--line:#E2E2E2;--gold:#F26B1D;--gold-soft:#C2410C;--radius:22px;--container:1100px}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:'Inter',Arial,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.5;overflow-x:hidden}
a{color:inherit}
.wrap{max-width:var(--container);margin:0 auto;padding:0 24px}
nav{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.85);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;justify-content:space-between;align-items:center;height:56px;gap:16px}
.brand{font-size:13px;font-weight:700;letter-spacing:.18em;text-decoration:none}
.navtag{font-size:13px;color:var(--slate);text-align:right}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-soft);margin-bottom:20px}
h1{font-size:clamp(40px,5.6vw,76px);font-weight:700;letter-spacing:-.035em;line-height:1.05}
.gold-t{color:var(--gold-soft)}
footer{border-top:1px solid var(--line);padding:40px 0;color:var(--slate);font-size:13px}

/* One-page layout */
.page{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:clamp(24px,4vw,64px);align-items:center;min-height:calc(100vh - 56px - 90px);padding:clamp(32px,5vw,56px) 24px}
.add{margin-top:32px;border-left:3px solid var(--gold);padding-left:16px;font-size:clamp(18px,1.9vw,22px);font-weight:700;letter-spacing:-.01em}
.add span{color:var(--gold-soft)}

/* Centrepiece: the no-go sign */
.sign-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:clamp(20px,3vw,36px);text-align:center;transition:transform .45s cubic-bezier(.2,.8,.2,1),box-shadow .45s cubic-bezier(.2,.8,.2,1),border-color .3s ease,background-color .3s ease}
.sign-card:hover{transform:translateY(-4px);border-color:var(--gold);background-color:#FFF8F3;box-shadow:0 18px 40px -18px rgba(242,107,29,.45)}
.sign{width:100%;max-width:380px;display:block;margin:0 auto;overflow:visible}
.sign text{font-family:'Inter',Arial,sans-serif}
.sign .bar{stroke-dasharray:400;stroke-dashoffset:400;animation:strike .9s cubic-bezier(.2,.8,.2,1) .4s forwards}
@keyframes strike{to{stroke-dashoffset:0}}
.sign .stamp{transform-box:fill-box;transform-origin:center;transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.sign-card:hover .stamp{transform:rotate(-8deg) scale(1.08)}
.flags-h{margin-top:clamp(18px,2.4vw,28px);font-size:12px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--slate)}
.flags{margin:12px auto 0;display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:360px}
.flag{font-size:14px;font-weight:600;padding:7px 12px;white-space:nowrap;border-radius:999px;background:#fff;border:1px solid var(--line);color:var(--ink);transition:border-color .3s ease,color .3s ease,transform .3s ease}
.flag::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--gold);margin-right:8px;vertical-align:1px}
.flag:hover{border-color:var(--gold);color:var(--gold-soft);transform:translateY(-2px)}

@media (prefers-reduced-motion:reduce){.sign-card,.flag,.sign .stamp{transition:none}.sign-card:hover,.flag:hover{transform:none}.sign-card:hover .stamp{transform:none}.sign .bar{animation:none;stroke-dashoffset:0}}
@media (max-width:900px){.page{grid-template-columns:1fr;min-height:0;gap:24px;padding:28px 16px}.wrap{padding-left:16px;padding-right:16px}.add{margin-top:18px}.sign{max-width:260px}.navtag{font-size:12px}}
</style>
</head>
<body>

<nav><div class="wrap"><a class="brand" href="/">ACCOUNTANCY ACCELERATOR</a><span class="navtag">Start · Niche · Niches to avoid</span></div></nav>

<main class="wrap page">
<div>
<p class="eyebrow">Level 4 - Niche · Video 6</p>
<h1>Niches to <span class="gold-t">avoid.</span></h1>
<p class="add"><span>Add yours:</span> why CIS</p>
</div>
<div class="sign-card">
<svg class="sign" viewBox="0 0 400 400" role="img" aria-label="No-go sign: avoid CIS">
<circle cx="200" cy="200" r="168" fill="#FFFFFF"/>
<circle cx="200" cy="200" r="168" fill="none" stroke="#F26B1D" stroke-width="30"/>
<line class="bar" x1="81" y1="81" x2="319" y2="319" stroke="#F26B1D" stroke-width="30" stroke-linecap="butt"/>
<text x="200" y="232" text-anchor="middle" font-size="104" font-weight="800" fill="#111111" letter-spacing="-2" stroke="#FFFFFF" stroke-width="12" paint-order="stroke" stroke-linejoin="round">CIS</text>
<g class="stamp">
<rect x="128" y="352" width="144" height="40" rx="20" fill="#111111"/>
<text x="200" y="379" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF" letter-spacing="4">AVOID</text>
</g>
</svg>
<p class="flags-h">Bad niche red flags</p>
<div class="flags"><span class="flag">Vague</span><span class="flag">Price-sensitive</span><span class="flag">Slow to decide</span><span class="flag">Low revenue</span></div>
</div>
</main>
<div class="wrap" style="display:flex;justify-content:space-between;gap:16px;padding:32px 24px;font-size:15px;font-weight:600"><a href="/start/clients-to-avoid/" style="text-decoration:none">&larr; Clients to avoid</a></div>
<footer><div class="wrap">Accountancy Accelerator · Start · Niche · Niches to avoid</div></footer>

</body>
</html>
