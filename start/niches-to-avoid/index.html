<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Niches to avoid - Accountancy Accelerator</title>
<meta name="description" content="Start, Level 4 Niche: Niches to avoid.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..800&display=swap" rel="stylesheet">
<style>
:root{--paper:#FFFFFF;--card:#F5F5F7;--ink:#111111;--muted:#555555;--slate:#6E6E73;--line:#E2E2E2;--gold:#F26B1D;--gold-soft:#C2410C;--radius:22px;--container:1100px}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:'Inter',Arial,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.5;overflow-x:hidden}
a{color:inherit}
.wrap{max-width:var(--container);margin:0 auto;padding:0 24px}
nav{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.85);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;justify-content:space-between;align-items:center;height:56px;gap:16px}
.brand{font-size:13px;font-weight:700;letter-spacing:.18em;text-decoration:none}
.navtag{font-size:13px;color:var(--slate);text-align:right}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-soft);margin-bottom:20px}
h1{font-size:clamp(40px,5.6vw,76px);font-weight:700;letter-spacing:-.035em;line-height:1.05}
.gold-t{color:var(--gold-soft)}
footer{border-top:1px solid var(--line);padding:40px 0;color:var(--slate);font-size:13px}

/* One-page layout */
.page{min-height:calc(100vh - 56px - 90px);display:flex;flex-direction:column;justify-content:center;padding:clamp(28px,4.5vw,52px) 24px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap}
.take{font-size:clamp(18px,2vw,24px);font-weight:700;letter-spacing:-.01em;border-left:3px solid var(--gold);padding-left:16px;max-width:420px}
.take span{color:var(--gold-soft)}
.cards{margin-top:clamp(28px,4vh,44px);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.nc{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:clamp(20px,2.4vw,30px) clamp(16px,2vw,24px);display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;transition:transform .45s cubic-bezier(.2,.8,.2,1),box-shadow .45s cubic-bezier(.2,.8,.2,1),border-color .3s ease,background-color .3s ease}
.nc:hover{transform:translateY(-6px);border-color:var(--gold);background-color:#FFF8F3;box-shadow:0 18px 40px -18px rgba(242,107,29,.45)}
.nc svg{width:clamp(96px,10vw,132px);height:auto;overflow:visible}
.nc .bar{stroke-dasharray:200;stroke-dashoffset:200;animation:strike .8s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes strike{to{stroke-dashoffset:0}}
.nc h2{font-size:clamp(18px,1.7vw,22px);font-weight:700;letter-spacing:-.02em;line-height:1.2}
.why{white-space:nowrap;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-soft);background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 12px}
@media (prefers-reduced-motion:reduce){.nc{transition:none}.nc:hover{transform:none}.nc .bar{animation:none;stroke-dashoffset:0}}
@media (max-width:900px){.cards{grid-template-columns:1fr 1fr;gap:12px}.page{min-height:0;padding:28px 16px}.wrap{padding-left:16px;padding-right:16px}.navtag{font-size:12px}}
@media (max-width:480px){.nc{padding:16px 10px;gap:10px}.nc svg{width:78px}.nc h2{font-size:16px}.why{white-space:normal;font-size:10px;letter-spacing:.1em;padding:5px 9px}}
</style>
</head>
<body>

<nav><div class="wrap"><a class="brand" href="/">ACCOUNTANCY ACCELERATOR</a><span class="navtag">Start · Niche · Niches to avoid</span></div></nav>

<main class="wrap page">
<div class="top">
<div>
<p class="eyebrow">Level 4 - Niche · Video 6</p>
<h1>Niches to <span class="gold-t">avoid.</span></h1>
</div>
<p class="take">Avoid the work that <span>costs more than it pays.</span></p>
</div>
<div class="cards" id="cards"></div>
</main>
<div class="wrap" style="display:flex;justify-content:space-between;gap:16px;padding:32px 24px;font-size:15px;font-weight:600"><a href="/start/clients-to-avoid/" style="text-decoration:none">&larr; Clients to avoid</a></div>
<footer><div class="wrap">Accountancy Accelerator · Start · Niche · Niches to avoid</div></footer>

<script>
(function(){
// Add a niche: {name, why, icon} where icon is SVG markup drawn inside a 100x100 box.
var NICHES=[
 {name:"Sole traders under the MTD threshold",why:"Low fees",icon:'<circle cx="50" cy="38" r="12" fill="none" stroke="#111" stroke-width="5"/><path d="M28 72c2-12 11-18 22-18s20 6 22 18" fill="none" stroke="#111" stroke-width="5" stroke-linecap="round"/>'},
 {name:"Cash only businesses",why:"Messy records",icon:'<rect x="24" y="34" width="52" height="32" rx="5" fill="none" stroke="#111" stroke-width="5"/><circle cx="50" cy="50" r="8" fill="none" stroke="#111" stroke-width="4"/>'},
 {name:"Small contractors who need CIS",why:"Low fees, high admin",icon:'<path d="M30 60v-6c0-11 9-20 20-20s20 9 20 20v6" fill="none" stroke="#111" stroke-width="5"/><path d="M44 35v12M56 35v12" stroke="#111" stroke-width="4"/><path d="M22 62h56" stroke="#111" stroke-width="6" stroke-linecap="round"/>'},
 {name:"Anything complex and uncommon, like partnerships",why:"Slow, specialist, rare",icon:'<circle cx="38" cy="40" r="9" fill="none" stroke="#111" stroke-width="5"/><circle cx="62" cy="40" r="9" fill="none" stroke="#111" stroke-width="5"/><path d="M22 70c2-9 8-14 16-14s14 5 16 14M46 70c2-9 8-14 16-14s14 5 16 14" fill="none" stroke="#111" stroke-width="5" stroke-linecap="round"/>'}
];
var box=document.getElementById("cards");
NICHES.forEach(function(n,i){
 var el=document.createElement("div");el.className="nc";
 el.innerHTML='<svg viewBox="0 0 100 100" role="img" aria-label="Avoid: '+n.name+'"><circle cx="50" cy="50" r="42" fill="#fff"/>'+n.icon+'<circle cx="50" cy="50" r="42" fill="none" stroke="#F26B1D" stroke-width="8"/><line class="bar" x1="20.3" y1="20.3" x2="79.7" y2="79.7" stroke="#F26B1D" stroke-width="8" style="animation-delay:'+(0.3+i*0.15)+'s"/></svg><h2>'+n.name+'</h2><span class="why">'+n.why+'</span>';
 box.appendChild(el);
});
})();
</script>
</body>
</html>
