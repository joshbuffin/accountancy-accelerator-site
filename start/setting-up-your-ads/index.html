<style>
:root{--paper:#FFFFFF;--card:#F5F5F7;--ink:#111111;--muted:#555555;--slate:#6E6E73;--line:#E2E2E2;--gold:#F26B1D;--gold-soft:#C2410C;--radius:22px;--container:1100px}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:'Inter',Arial,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.5}
a{color:inherit}
.wrap{max-width:var(--container);margin:0 auto;padding:0 24px}
nav{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.85);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;justify-content:space-between;align-items:center;height:56px;gap:16px}
.brand{font-size:13px;font-weight:700;letter-spacing:.18em;text-decoration:none}
.navtag{font-size:13px;color:var(--slate);text-align:right}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-soft);margin-bottom:18px}
h1{font-size:clamp(40px,5.4vw,72px);font-weight:700;letter-spacing:-.035em;line-height:1.05}
.gold-t{color:var(--gold-soft)}

.pnav{display:flex;justify-content:space-between;gap:16px;padding:18px 24px;font-size:15px;font-weight:600}

/* Setting up your ads: on your own vs with Ryan */
.hero{padding-top:clamp(22px,3.4vh,40px)}
.hero h1{font-size:clamp(38px,4.6vw,62px)}
.k{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--slate)}
.stage{margin-top:clamp(18px,2.8vh,32px);background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:clamp(16px,2vw,26px) clamp(16px,2.4vw,30px) clamp(14px,1.8vw,22px);transition:transform .45s cubic-bezier(.2,.8,.2,1),border-color .3s ease,background-color .4s ease,box-shadow .45s ease}
.stage:hover{transform:translateY(-3px)}
.stage.ryan{background:#FFF8F3;border-color:var(--gold);box-shadow:0 18px 40px -26px rgba(242,107,29,.5)}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.top h2{font-size:clamp(20px,2.2vw,28px);font-weight:800;letter-spacing:-.025em;line-height:1.1}
.top h2 span{color:var(--gold-soft)}
.seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px;gap:4px}
.seg button{font:inherit;font-size:14px;font-weight:700;border:0;background:transparent;color:var(--slate);border-radius:999px;padding:8px 16px;cursor:pointer;transition:background-color .25s ease,color .25s ease,transform .2s ease}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:#3A3A3C;color:#fff}
.seg button.go[aria-pressed="true"]{background:var(--gold);color:#0A0A0A;box-shadow:0 8px 20px -10px rgba(242,107,29,.7)}
.seg button.go[aria-pressed="false"]{color:var(--gold-soft)}
.viz{position:relative;margin-top:6px}
.viz svg{width:100%;height:auto;display:block}
.viz svg text{font-family:'Inter',Arial,sans-serif}
.portrait{display:none!important}
.alone,.with{transition:opacity .5s ease}
.with{opacity:0}
.stage.ryan .alone{opacity:0}
.stage.ryan .with{opacity:1}
.rline{stroke-dasharray:700;stroke-dashoffset:700;transition:stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1) .15s}
.portrait .rline{stroke-dasharray:330;stroke-dashoffset:330}
.stage.ryan .rline{stroke-dashoffset:0}
.endn{transition:fill .5s ease .6s,stroke .5s ease .6s}
.stage.ryan .endn{fill:var(--gold);stroke:var(--gold)}
.stage.ryan .endt{fill:#0A0A0A}
.step{display:flex;justify-content:space-between;align-items:center;gap:12px 18px;flex-wrap:wrap;margin-top:clamp(14px,2vh,22px);background:var(--gold);color:#0A0A0A;border-radius:18px;padding:14px 20px;transition:transform .45s cubic-bezier(.2,.8,.2,1),box-shadow .45s ease}
.step:hover{transform:translateY(-3px);box-shadow:0 16px 30px -18px rgba(242,107,29,.7)}
.step .k{color:#3A2A1E}
.step h3{font-size:clamp(22px,2.4vw,30px);font-weight:800;letter-spacing:-.03em;line-height:1.05}
.add{border:2px dashed rgba(0,0,0,.35);border-radius:999px;padding:8px 16px;font-size:14px;font-weight:700;text-decoration:none;background:rgba(255,255,255,.22)}
@media (max-width:640px){.landscape{display:none!important}.portrait{display:block!important;max-width:380px;margin:0 auto}.seg button{padding:8px 12px;font-size:13px}.navtag{font-size:11px}.pnav{font-size:14px}}
@media (prefers-reduced-motion:reduce){.stage,.step,.alone,.with,.rline,.endn,.seg button{transition:none}.stage:hover,.step:hover{transform:none}}
</style>
</head>

<script>
(function(){
var s=document.getElementById("stage"),a=document.getElementById("bAlone"),r=document.getElementById("bRyan"),v=document.getElementById("verdict");
function set(ryan){s.classList.toggle("ryan",ryan);a.setAttribute("aria-pressed",String(!ryan));r.setAttribute("aria-pressed",String(ryan));v.innerHTML=ryan?"Set up right. <span>Ads live.</span>":"Stuck in set-up."}
a.addEventListener("click",function(){set(false)});
r.addEventListener("click",function(){set(true)});
})();
