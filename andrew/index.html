<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Partner Plan - Accountancy Accelerator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#000000;
  --card:#121212;
  --ink:#F5F5F7;
  --muted:#C7C7CC;
  --slate:#98989D;
  --line:#2A2A2C;
  --gold:#B68A4E;
  --gold-soft:#DDB273;
  --radius:18px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:'Inter',Arial,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.6;font-size:16px}
a{color:var(--gold-soft);text-underline-offset:2px}
.wrap{max-width:1140px;margin:0 auto;padding:0 20px}
.narrow{max-width:720px}
nav{position:sticky;top:0;z-index:10;background:rgba(0,0,0,.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;justify-content:space-between;align-items:center;height:52px}
.brand{font-size:13px;font-weight:600;letter-spacing:.14em;color:#fff;text-decoration:none}
.navtag{font-size:13px;color:var(--slate)}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-soft);margin-bottom:12px}
.doc{max-width:720px;margin:0 auto;padding:48px 20px 24px}
h1{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.2;margin-bottom:8px}
h2{font-size:21px;font-weight:600;letter-spacing:-.01em;line-height:1.3;margin:40px 0 12px;padding-top:24px;border-top:1px solid var(--line)}
h3{font-size:17px;font-weight:600;margin:24px 0 8px}
p{color:var(--muted);margin-bottom:14px}
.byline{font-size:14px;color:var(--slate);margin-bottom:24px}
.label{color:var(--ink);font-weight:600;margin:20px 0 6px}
ul,ol{margin:0 0 14px;padding-left:22px}
li{color:var(--muted);margin-bottom:6px}
li ul{margin:6px 0 0}
li::marker{color:var(--gold)}
table{width:100%;border-collapse:collapse;margin:4px 0 16px;font-size:15px}
td,th{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);color:var(--muted)}
th{color:var(--slate);font-weight:500;font-size:13px}
td:last-child,th:last-child{text-align:right;color:var(--ink);font-variant-numeric:tabular-nums}
tr.total td{font-weight:600;color:var(--ink);border-bottom:0}
tr.total td:last-child{color:var(--gold-soft)}
footer{padding:28px 0 48px;font-size:13px;color:var(--slate);border-top:1px solid var(--line)}
footer .wm{font-size:13px;font-weight:600;letter-spacing:.12em;color:var(--ink);display:block;margin-bottom:4px}
/* password gate */
#gate{min-height:calc(100vh - 61px);display:flex;align-items:center;justify-content:center;padding:24px}
#gate form{width:100%;max-width:400px;text-align:center}
#gate h1{font-size:24px;margin-bottom:10px}
#gate p{margin-bottom:26px}
#gate input{width:100%;font:inherit;font-size:18px;text-align:center;letter-spacing:.2em;padding:15px 18px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);margin-bottom:14px}
#gate input:focus{outline:2px solid var(--gold);outline-offset:2px}
#gate button{width:100%;font:inherit;font-size:17px;font-weight:600;padding:15px;border-radius:999px;border:0;background:var(--ink);color:#000;cursor:pointer}
#gate button:disabled{opacity:.6;cursor:default}
#err{color:#FF8A80;font-size:15px;min-height:24px;margin-top:12px}
@media (max-width:640px){
  body{font-size:16px}
  .cols{grid-template-columns:1fr}
  .phase{grid-template-columns:1fr;gap:12px}
  .sum{flex-direction:column;gap:4px}
  .sum .v{text-align:left}
  .navtag{display:none}
}
</style>
</head>
<body>
<nav><div class="wrap"><a class="brand" href="https://www.accountancyaccelerator.com">ACCOUNTANCY ACCELERATOR</a><span class="navtag">Private plan</span></div></nav>
<div id="gate">
  <form id="f">
    <p class="eyebrow">Private page</p>
    <h1>Your Partner plan</h1>
    <p>Please enter the password Josh sent you.</p>
    <input id="pw" type="password" inputmode="numeric" autocomplete="off" aria-label="Password" autofocus>
    <button id="go" type="submit">View my plan</button>
    <div id="err" role="alert"></div>
  </form>
</div>
<main id="plan" hidden></main>
<footer hidden id="foot"><div class="wrap narrow"><span class="wm">ACCOUNTANCY ACCELERATOR</span>Prepared privately for Andrew. Please don't share this page.</div></footer>

  const btn=document.getElementById('go'),err=document.getElementById('err');

  try{
