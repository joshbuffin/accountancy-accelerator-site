<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Partner Plan - Accountancy Accelerator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#000000;
  --card:#121212;
  --ink:#F5F5F7;
  --muted:#C7C7CC;
  --slate:#98989D;
  --line:#2A2A2C;
  --gold:#B68A4E;
  --gold-soft:#DDB273;
  --radius:18px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:'Inter',Arial,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.65;font-size:18px}
a{color:var(--gold-soft)}
.wrap{max-width:1140px;margin:0 auto;padding:0 24px}
.narrow{max-width:780px}
nav{position:sticky;top:0;z-index:10;background:rgba(0,0,0,.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;justify-content:space-between;align-items:center;height:60px}
.brand{font-size:14px;font-weight:600;letter-spacing:.14em;color:#fff;text-decoration:none}
.navtag{font-size:14px;color:var(--slate)}
.hero{padding:clamp(64px,10vw,112px) 0 clamp(40px,6vw,64px);border-bottom:1px solid var(--line)}
section{padding:clamp(52px,8vw,88px) 0;border-bottom:1px solid var(--line)}
section.alt{background:var(--card)}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-soft);margin-bottom:14px}
h1{font-size:clamp(34px,5.5vw,54px);font-weight:700;letter-spacing:-.025em;line-height:1.1;margin-bottom:22px}
h2{font-size:clamp(26px,3.6vw,36px);font-weight:700;letter-spacing:-.02em;line-height:1.2;margin-bottom:22px}
h2.mt{margin-top:56px}
h3{font-size:21px;font-weight:600;letter-spacing:-.01em;margin-bottom:12px}
p{color:var(--muted);margin-bottom:18px}
.lead{font-size:clamp(19px,2.2vw,22px);color:var(--ink);line-height:1.55}
.byline{font-size:15px;color:var(--slate);margin-top:26px}
ul,ol{margin:0 0 22px 0}
li{color:var(--muted);margin-bottom:10px}
.ticks{list-style:none}
.ticks li{position:relative;padding-left:30px}
.ticks li::before{content:"";position:absolute;left:4px;top:.55em;width:10px;height:10px;border-radius:50%;border:2px solid var(--gold)}
.outcomes{list-style:none;counter-reset:o}
.outcomes li{counter-increment:o;position:relative;padding-left:44px;margin-bottom:14px;color:var(--ink)}
.outcomes li::before{content:counter(o);position:absolute;left:0;top:0;width:30px;height:30px;border-radius:50%;background:var(--gold);color:#000;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center}
.sums{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin:8px 0 28px;background:var(--paper)}
section.alt .sums{background:#0A0A0A}
.sum{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:18px 22px;border-bottom:1px solid var(--line)}
.sum:last-child{border-bottom:0}
.sum .k{color:var(--muted)}
.sum .v{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.sum.total{background:rgba(182,138,78,.12)}
.sum.total .k{color:var(--ink);font-weight:600}
.sum.total .v{color:var(--gold-soft);font-size:20px}
.sum small{font-size:14px;color:var(--slate);font-weight:400}
.phase{display:grid;grid-template-columns:52px 1fr;gap:20px;padding:28px 0;border-top:1px solid var(--line)}
.phase .num{width:44px;height:44px;border-radius:50%;border:2px solid var(--gold);color:var(--gold-soft);font-weight:700;font-size:19px;display:flex;align-items:center;justify-content:center}
.phase ul{padding-left:20px}
.phase li::marker{color:var(--gold)}
.note{border-left:3px solid var(--gold);padding:4px 0 4px 18px;margin-top:12px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:8px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:26px}
.links{font-size:16px;margin-top:28px}
footer{padding:40px 0 56px;font-size:13px;color:var(--slate)}
footer .wm{font-size:15px;font-weight:600;letter-spacing:.12em;color:var(--ink);display:block;margin-bottom:6px}
/* password gate */
#gate{min-height:calc(100vh - 61px);display:flex;align-items:center;justify-content:center;padding:24px}
#gate form{width:100%;max-width:400px;text-align:center}
#gate h1{font-size:30px;margin-bottom:12px}
#gate p{margin-bottom:26px}
#gate input{width:100%;font:inherit;font-size:20px;text-align:center;letter-spacing:.2em;padding:15px 18px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);margin-bottom:14px}
#gate input:focus{outline:2px solid var(--gold);outline-offset:2px}
#gate button{width:100%;font:inherit;font-size:17px;font-weight:600;padding:15px;border-radius:999px;border:0;background:var(--ink);color:#000;cursor:pointer}
#gate button:disabled{opacity:.6;cursor:default}
#err{color:#FF8A80;font-size:15px;min-height:24px;margin-top:12px}
@media (max-width:640px){
  body{font-size:17px}
  .cols{grid-template-columns:1fr}
  .phase{grid-template-columns:1fr;gap:12px}
  .sum{flex-direction:column;gap:4px}
  .sum .v{text-align:left}
  .navtag{display:none}
}
</style>
</head>
<body>
<nav><div class="wrap"><a class="brand" href="https://www.accountancyaccelerator.com">ACCOUNTANCY ACCELERATOR</a><span class="navtag">Private plan</span></div></nav>
<div id="gate">
  <form id="f">
    <p class="eyebrow">Private page</p>
    <h1>Your Partner plan</h1>
    <p>Please enter the password Josh sent you.</p>
    <input id="pw" type="password" inputmode="numeric" autocomplete="off" aria-label="Password" autofocus>
    <button id="go" type="submit">View my plan</button>
    <div id="err" role="alert"></div>
  </form>
</div>
<main id="plan" hidden></main>
<footer hidden id="foot"><div class="wrap narrow"><span class="wm">ACCOUNTANCY ACCELERATOR</span>Prepared privately for Andrew. Please don't share this page.</div></footer>

document.getElementById('f').addEventListener('submit',async e=>{

  const btn=document.getElementById('go'),err=document.getElementById('err');

  try{
