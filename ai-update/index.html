function u(b){return Uint8Array.from(atob(b),function(ch){return ch.charCodeAt(0)})}
async function open(pw){
  var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(D.s),iterations:250000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  var html=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u(D.i)},key,u(D.c)));
  try{sessionStorage.setItem('ai-update',pw)}catch(e){}
  document.open();document.write(html);document.close();
}
document.getElementById('f').addEventListener('submit',function(e){
  e.preventDefault();
  var b=this.querySelector('button');b.textContent='Unlocking...';
  open(document.getElementById('pw').value.trim().toUpperCase()).catch(function(){
    b.textContent='View the page';
    document.getElementById('err').textContent="That password isn't right. Try again.";
  });
});
try{var saved=sessionStorage.getItem('ai-update');if(saved)open(saved).catch(function(){})}catch(e){}
