<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Ste Evans - Phase 1 Plan - Accountancy Accelerator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#000000;
  --card:#121212;
  --ink:#F5F5F7;
  --muted:#C7C7CC;
  --slate:#98989D;
  --line:#2A2A2C;
  --gold:#B68A4E;
  --gold-soft:#DDB273;
  --radius:18px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:'Inter',Arial,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.6;font-size:16px}
a{color:var(--gold-soft);text-underline-offset:2px}
.wrap{max-width:1140px;margin:0 auto;padding:0 20px}
.narrow{max-width:720px}
nav{position:sticky;top:0;z-index:10;background:rgba(0,0,0,.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;justify-content:space-between;align-items:center;height:52px}
.brand{font-size:13px;font-weight:600;letter-spacing:.14em;color:#fff;text-decoration:none}
.navtag{font-size:13px;color:var(--slate)}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-soft);margin-bottom:12px}
.doc{max-width:720px;margin:0 auto;padding:48px 20px 24px}
h1{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.2;margin-bottom:8px}
h2{font-size:21px;font-weight:600;letter-spacing:-.01em;line-height:1.3;margin:40px 0 12px;padding-top:24px;border-top:1px solid var(--line)}
h3{font-size:17px;font-weight:600;margin:24px 0 8px}
p{color:var(--muted);margin-bottom:14px}
.byline{font-size:14px;color:var(--slate);margin-bottom:24px}
.label{color:var(--ink);font-weight:600;margin:20px 0 6px}
ul,ol{margin:0 0 14px;padding-left:22px}
li{color:var(--muted);margin-bottom:6px}
li ul{margin:6px 0 0}
li::marker{color:var(--gold)}
table{width:100%;border-collapse:collapse;margin:4px 0 16px;font-size:15px}
td,th{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);color:var(--muted)}
th{color:var(--slate);font-weight:500;font-size:13px}
td:last-child,th:last-child{text-align:right;color:var(--ink);font-variant-numeric:tabular-nums}
tr.total td{font-weight:600;color:var(--ink);border-bottom:0}
tr.total td:last-child{color:var(--gold-soft)}
footer{padding:28px 0 48px;font-size:13px;color:var(--slate);border-top:1px solid var(--line)}
footer .wm{font-size:13px;font-weight:600;letter-spacing:.12em;color:var(--ink);display:block;margin-bottom:4px}
/* password gate */
#gate{min-height:calc(100vh - 61px);display:flex;align-items:center;justify-content:center;padding:24px}
#gate form{width:100%;max-width:400px;text-align:center}
#gate h1{font-size:24px;margin-bottom:10px}
#gate p{margin-bottom:26px}
#gate input{width:100%;font:inherit;font-size:18px;text-align:center;letter-spacing:.2em;padding:15px 18px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);margin-bottom:14px}
#gate input:focus{outline:2px solid var(--gold);outline-offset:2px}
#gate button{width:100%;font:inherit;font-size:17px;font-weight:600;padding:15px;border-radius:999px;border:0;background:var(--ink);color:#000;cursor:pointer}
#gate button:disabled{opacity:.6;cursor:default}
#err{color:#FF8A80;font-size:15px;min-height:24px;margin-top:12px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:6px 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px}
.card .label{margin-top:0}.card p:last-child{margin-bottom:0}
.goals{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 22px 6px;margin:22px 0 8px}
.goals .label{margin-top:0}
.sheet-card{display:block;text-decoration:none;border:1px solid var(--gold);border-radius:var(--radius);padding:18px 22px;margin:8px 0 8px;background:linear-gradient(135deg,rgba(182,138,78,.16),rgba(182,138,78,.04))}
.sheet-card span{display:block}
.sc-k{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-soft)}
.sc-t{color:var(--muted);margin:6px 0 10px}
.sc-cta{color:var(--ink);font-weight:600}
.sheet-card:hover .sc-cta{color:var(--gold-soft)}
.step{display:grid;grid-template-columns:44px 1fr;gap:16px;padding:22px 0;border-bottom:1px solid var(--line)}
.step:last-of-type{border-bottom:0}
.step h3{margin-top:4px}
.num{width:40px;height:40px;border-radius:50%;border:1px solid var(--gold);color:var(--gold-soft);display:flex;align-items:center;justify-content:center;font-weight:600}
.owner{font-size:13px;color:var(--slate);margin-bottom:10px}
.note{font-size:14px;color:var(--slate)}
strong{color:var(--ink);font-weight:600}
td:last-child{white-space:nowrap}
table.wide td:last-child,table.wide th:last-child{text-align:left;color:var(--muted);font-variant-numeric:normal;white-space:normal}
@media (max-width:640px){
  .step{grid-template-columns:1fr;gap:10px}
  table.wide{font-size:14px}
  td,th{padding:8px 6px}
  body{font-size:16px}
  .cols{grid-template-columns:1fr}
  .phase{grid-template-columns:1fr;gap:12px}
  .sum{flex-direction:column;gap:4px}
  .sum .v{text-align:left}
  .navtag{display:none}
}
/* premium layer */
html{scroll-behavior:smooth}
body{line-height:1.72;overflow-x:hidden}
.aura{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.aura i{position:absolute;border-radius:50%;filter:blur(80px);animation:drift 24s ease-in-out infinite alternate}
.aura i:nth-child(1){width:560px;height:560px;top:-200px;left:-160px;background:radial-gradient(circle,rgba(182,138,78,.30),transparent 68%)}
.aura i:nth-child(2){width:520px;height:520px;top:38%;right:-220px;background:radial-gradient(circle,rgba(221,178,115,.16),transparent 68%);animation-duration:30s}
.aura i:nth-child(3){width:620px;height:620px;bottom:-280px;left:20%;background:radial-gradient(circle,rgba(120,90,50,.20),transparent 68%);animation-duration:36s}
.aura::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1px);background-size:28px 28px;-webkit-mask-image:radial-gradient(ellipse at 50% 0,#000,transparent 70%);mask-image:radial-gradient(ellipse at 50% 0,#000,transparent 70%)}
@keyframes drift{to{transform:translate3d(90px,70px,0) scale(1.15)}}
nav{background:rgba(0,0,0,.6)}
#prog{position:absolute;left:0;bottom:-1px;height:2px;width:100%;transform-origin:0 50%;transform:scaleX(0);background:linear-gradient(90deg,var(--gold),var(--gold-soft));box-shadow:0 0 12px rgba(221,178,115,.6)}
.doc{max-width:780px;padding:120px 24px 72px}
.eyebrow{display:flex;align-items:center;gap:12px;margin-bottom:24px}
.doc>.eyebrow::before{content:"";width:28px;height:1px;background:var(--gold)}
h1{font-size:clamp(38px,6vw,58px);line-height:1.06;letter-spacing:-.035em;margin-bottom:24px;background:linear-gradient(180deg,#fff 35%,#d9bf95);-webkit-background-clip:text;background-clip:text;color:transparent}
.byline{margin-bottom:64px}
h2{font-size:clamp(26px,3.4vw,34px);line-height:1.15;letter-spacing:-.028em;margin:120px 0 28px;padding-top:0;border-top:0}
h2::before{content:"";display:block;width:44px;height:2px;margin-bottom:26px;background:linear-gradient(90deg,var(--gold),transparent)}
h3{font-size:21px;letter-spacing:-.015em;line-height:1.3;margin:6px 0 10px}
p{margin-bottom:22px}
ul,ol{margin-bottom:24px}
li{margin-bottom:14px;padding-left:4px}
.card,.step,.tcard,.sheet-card{position:relative;border-radius:24px;border:1px solid rgba(255,255,255,.08);background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.012));box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 40px 80px -40px rgba(0,0,0,.95),0 16px 32px -16px rgba(0,0,0,.7);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.sheet-card{border-color:rgba(182,138,78,.55);background:linear-gradient(135deg,rgba(182,138,78,.22),rgba(182,138,78,.04) 60%,rgba(255,255,255,.02));padding:32px 36px;margin:0 0 8px;box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 40px 80px -36px rgba(182,138,78,.35),0 16px 32px -16px rgba(0,0,0,.7)}
.sc-t{margin:10px 0 16px}
.sc-cta{display:inline-block!important;transition:transform .3s}
.sheet-card:hover .sc-cta{transform:translateX(6px)}
.cols{gap:22px;margin:32px 0 8px}
.card{padding:30px 30px 26px}
.card .label{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-soft);margin-bottom:12px}
.step{grid-template-columns:64px 1fr;gap:26px;padding:40px 40px 22px;margin-bottom:26px;border-bottom:1px solid rgba(255,255,255,.08)}
.step:last-of-type{border-bottom:1px solid rgba(255,255,255,.08)}
.num{width:54px;height:54px;font-size:21px;font-weight:700;border:0;color:#1d1408;background:radial-gradient(circle at 32% 26%,#f6dcab,#c4975a 52%,#6d4f26);box-shadow:0 14px 28px -8px rgba(182,138,78,.6),inset 0 -4px 8px rgba(0,0,0,.35),inset 0 2px 3px rgba(255,255,255,.55);transform:translateZ(40px)}
.owner{font-size:13px;margin-bottom:18px}
.tcard{padding:6px 24px;margin:28px 0 32px;overflow-x:auto}
.step .tcard{background:rgba(0,0,0,.35);box-shadow:inset 0 1px 0 rgba(255,255,255,.05);border-radius:18px;padding:4px 18px}
.tcard table{margin:0}
td,th{padding:15px 12px}
th{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase}
tr:last-child td{border-bottom:0}
tr{transition:background .25s}
tr:hover td{background:rgba(255,255,255,.025)}
.note{margin-top:4px}
.tilt{transform-style:preserve-3d;will-change:transform}
.tilt::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .4s;background:radial-gradient(500px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.07),transparent 45%)}
.tilt:hover::after{opacity:1}
.rv{opacity:0;transform:perspective(1200px) translate3d(0,48px,0) rotateX(9deg);transition:opacity 1s ease,transform 1.1s cubic-bezier(.16,.84,.24,1)}
.rv.in{opacity:1;transform:none}
#gate form{padding:52px 40px;border-radius:28px;border:1px solid rgba(255,255,255,.08);background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.01));box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 50px 100px -40px rgba(0,0,0,.95);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
#gate .eyebrow{justify-content:center}
#gate button{transition:transform .2s,box-shadow .3s}
#gate button:hover{transform:translateY(-2px);box-shadow:0 14px 30px -10px rgba(221,178,115,.5)}
footer{padding:40px 0 64px}
@media (max-width:640px){
  .doc{padding:72px 16px 48px}
  .byline{margin-bottom:44px}
  h2{margin:88px 0 22px}
  .step{grid-template-columns:1fr;gap:16px;padding:28px 22px 12px}
  .num{width:46px;height:46px;font-size:18px}
  .card{padding:24px 22px 20px}
  .sheet-card{padding:26px 24px}
  .tcard{padding:4px 12px}
  .step .tcard{margin-left:-8px;margin-right:-8px;padding:2px 10px}
  #gate form{padding:40px 24px}
  .aura i{filter:blur(60px)}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .aura i{animation:none}
  .rv{opacity:1;transform:none;transition:none}
}
</style>
</head>

function enhance(){
  const plan=document.getElementById('plan');
  const rm=matchMedia('(prefers-reduced-motion: reduce)').matches;
  plan.querySelectorAll('table').forEach(t=>{const w=document.createElement('div');w.className='tcard';t.before(w);w.append(t)});
  const els=plan.querySelectorAll('.doc>*:not(.cols),.cols>.card');
  if(!rm&&'IntersectionObserver' in window){
    els.forEach(el=>el.classList.add('rv'));
    plan.querySelectorAll('.cols>.card:nth-child(2)').forEach(el=>el.style.transitionDelay='.12s');
    const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{rootMargin:'0px 0px -6% 0px',threshold:.06});
    els.forEach(el=>io.observe(el));
  }
  if(!rm&&matchMedia('(hover: hover) and (pointer: fine)').matches){
    plan.querySelectorAll('.card,.sheet-card,.step').forEach(el=>{
      const max=el.classList.contains('step')?3:7;
      el.classList.add('tilt');
      el.addEventListener('pointermove',e=>{
        const r=el.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
        el.style.transition='transform .15s ease-out';
        el.style.transform='perspective(1100px) rotateX('+((.5-y)*max)+'deg) rotateY('+((x-.5)*max)+'deg) scale(1.012)';
        el.style.setProperty('--mx',x*100+'%');el.style.setProperty('--my',y*100+'%');
      });
      el.addEventListener('pointerleave',()=>{el.style.transition='transform .7s cubic-bezier(.16,.84,.24,1)';el.style.transform=''});
    });
  }
  const bar=document.createElement('div');bar.id='prog';document.querySelector('nav').append(bar);
  const aura=document.querySelector('.aura');let ticking=false;
  const onScroll=()=>{
    const h=document.documentElement,max=h.scrollHeight-h.clientHeight;
    bar.style.transform='scaleX('+(max>0?h.scrollTop/max:0)+')';
    if(!rm)aura.style.transform='translate3d(0,'+(h.scrollTop*-.12)+'px,0)';
    ticking=false;
  };
  addEventListener('scroll',()=>{if(!ticking){ticking=true;requestAnimationFrame(onScroll)}},{passive:true});
  onScroll();
}
const u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
document.getElementById('f').addEventListener('submit',async e=>{
  e.preventDefault();
  const btn=document.getElementById('go'),err=document.getElementById('err');
  btn.disabled=true;btn.textContent='Opening...';err.textContent='';
  try{
    const b=await crypto.subtle.importKey('raw',new TextEncoder().encode(document.getElementById('pw').value.trim()),'PBKDF2',false,['deriveKey']);
    const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(D.s),iterations:D.n,hash:'SHA-256'},b,{name:'AES-GCM',length:256},false,['decrypt']);
    const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u(D.i)},k,u(D.c)));
    document.getElementById('plan').innerHTML=html;
    document.getElementById('gate').remove();
    document.getElementById('plan').hidden=false;
    document.getElementById('foot').hidden=false;
    window.scrollTo(0,0);enhance();
  }catch(_){
    err.textContent='That password is not right. Please try again.';
    btn.disabled=false;btn.textContent='View my plan';
  }
});
</script>
