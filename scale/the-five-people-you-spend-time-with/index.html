<style>
:root{--paper:#FFFFFF;--card:#F5F5F7;--ink:#111111;--muted:#555555;--slate:#6E6E73;--line:#E2E2E2;--gold:#F26B1D;--gold-soft:#C2410C;--radius:22px;--container:1100px}

nav{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.85);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line)}

.page{padding:clamp(14px,2vh,22px) 24px 0}

.sub{font-size:clamp(15px,1.4vw,18px);font-weight:600;color:var(--gold-soft);margin-top:8px}
.stage{position:relative;aspect-ratio:760/740;width:min(100%,calc((100vh - 235px)*760/740));min-width:300px;margin:6px auto 0}
.lines{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.arr .base{fill:none;stroke:#D9D9DE;stroke-width:3;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:0;transition:stroke .3s}
.arr .flow{fill:none;stroke:var(--gold);stroke-width:3;stroke-linecap:round;stroke-dasharray:4 12;opacity:.0;animation:fl 1.1s linear infinite;transition:opacity .4s}
.arr .dot{fill:var(--gold);opacity:.0;transition:opacity .4s}
.stage.go .arr .flow{opacity:.55}.stage.go .arr .dot{opacity:.9}
.arr.on .base{stroke:var(--gold);stroke-width:4}.arr.on .flow{opacity:1;stroke:#fff;stroke-width:2}
@keyframes fl{to{stroke-dashoffset:-16}}
.stage.anim .arr .base{stroke-dasharray:1;stroke-dashoffset:1}
.stage.anim.go .arr .base{stroke-dashoffset:0;transition:stroke-dashoffset .6s ease var(--d),stroke .3s}
.stage.anim .arr .flow,.stage.anim .arr .dot{opacity:0}
.stage.anim.go .arr .flow{opacity:.55;transition:opacity .5s ease calc(var(--d) + .6s)}
.stage.anim.go .arr .dot{opacity:.9;transition:opacity .5s ease calc(var(--d) + .6s)}
.stage.anim.go .arr.on .flow{opacity:1}
.you,.pp{position:absolute;transform:translate(-50%,-50%);aspect-ratio:100/110}
.you{z-index:2;width:13%}
.you svg{display:block;width:100%;fill:var(--gold);filter:drop-shadow(0 14px 22px rgba(242,107,29,.35))}
.ypill{position:absolute;left:50%;bottom:-30px;transform:translateX(-50%);background:var(--gold);color:#fff;font-weight:700;font-size:clamp(15px,1.5vw,20px);letter-spacing:-.01em;padding:5px 22px;border-radius:999px}
.pp{width:12%;background:none;border:0;font:inherit;color:inherit;cursor:default;z-index:3;padding:0}
.pp svg{display:block;width:100%;fill:#FDD9C0;transition:fill .3s,transform .4s cubic-bezier(.2,.8,.2,1)}
.pill{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:8px;background:#fff;border:1.5px solid var(--line);color:var(--ink);font-weight:600;font-size:clamp(14px,1.25vw,17px);line-height:1.25;padding:7px 16px;border-radius:999px;text-align:center;white-space:nowrap;transition:background .3s,color .3s,border-color .3s,box-shadow .3s}
.pp:hover svg,.pp:focus-visible svg,.pp.on svg{fill:var(--gold);transform:translateY(-3px)}
.pp:hover .pill,.pp:focus-visible .pill,.pp.on .pill{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:8px;background:var(--gold);border-color:var(--gold);color:#fff;box-shadow:0 10px 24px -10px rgba(242,107,29,.7)}
.pp:focus-visible{outline:none}
.stage.anim .pp,.stage.anim .you{opacity:0}
.stage.anim .pp{translate:0 10px}
.stage.anim.go .pp,.stage.anim.go .you{opacity:1;translate:0 0;transition:opacity .6s ease var(--d,0s),translate .6s ease var(--d,0s)}
.pnav{display:flex;justify-content:space-between;gap:16px;padding:14px 24px;font-size:15px;font-weight:600}
@media (prefers-reduced-motion:reduce){.arr .flow{animation:none}.arr .dot{display:none}.pp svg,.pill{transition:none}}
@media (max-width:900px){.page{padding:20px 16px 0}.wrap{padding-left:16px;padding-right:16px}.navtag{font-size:12px}
.stage{width:100%;min-width:0}
.pp{width:19%}.you{width:24%}
.stage{margin-bottom:70px}.arr .base,.arr .flow{stroke-width:4}.pill{font-size:13px;padding:5px 10px;border-radius:16px;white-space:normal;width:max-content;max-width:128px;line-height:1.2}
.pp[data-i="0"] .pill{white-space:nowrap;max-width:none}
.ypill{position:absolute;left:50%;bottom:-30px;transform:translateX(-50%);font-size:15px;padding:4px 16px}}
</style>
</head>

<script>
(function(){
var v=document.getElementById("map"),pp=v.querySelectorAll(".pp"),ar=v.querySelectorAll(".arr");
function set(i,on){ar[i].classList.toggle("on",on);pp[i].classList.toggle("on",on)}
pp.forEach(function(p,i){["mouseenter","focus"].forEach(function(e){p.addEventListener(e,function(){set(i,true)})});["mouseleave","blur"].forEach(function(e){p.addEventListener(e,function(){set(i,false)})})});
function go(){v.classList.add("go")}
if(window.matchMedia("(prefers-reduced-motion:reduce)").matches||!("IntersectionObserver" in window)){go();return}
v.classList.add("anim");
var io=new IntersectionObserver(function(e){if(e[0].isIntersecting){go();io.disconnect()}},{threshold:.15});
io.observe(v);
setTimeout(go,2500);
})();
</script>
